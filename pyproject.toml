[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cachalot"
version = "0.23.0"
description = "SSD-backed Mixture-of-Experts runtime for DeepSeek V4.1 Flash on Apple Silicon (MLX + Metal), with an OpenAI-compatible server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hamed Prooshani" }]
keywords = ["deepseek", "mixture-of-experts", "mlx", "apple-silicon", "metal", "llm", "inference", "openai-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32.2",
    "numpy>=2.0",
    "safetensors>=0.5",
    "transformers>=5.0",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
    "psutil>=6.0",
    "sympy>=1.13",
    "ml_dtypes>=0.5",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
vision = ["pillow>=11.0"]

[project.urls]
Homepage = "https://github.com/prooshani/cachalot"
Repository = "https://github.com/prooshani/cachalot"
Issues = "https://github.com/prooshani/cachalot/issues"

[project.scripts]
cachalot = "cachalot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# run_reference.py is handed to an operator and run with whatever python3 is
# on their machine -- 3.9.6 on this one. datetime.UTC is 3.11+, so the
# portable timezone.utc spelling has to stay.
"benchmarks/run_reference.py" = ["UP017"]
