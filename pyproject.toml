[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-v41-mac"
version = "0.1.0"
description = "Experimental DeepSeek V4.1 Flash SSD-backed MoE runtime for Apple Silicon"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mlx==0.32.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.31.0",
    "numpy==2.5.3",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
